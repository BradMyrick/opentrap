<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }} - free, open-source alternative to Burp Suite</title>
<meta name="description" content="{{ site.description }}">
<link rel="canonical" href="https://opentrap.github.io/opentrap/">
<link rel="icon" type="image/svg+xml" href="images/opentrap.svg">

<!-- Open Graph / social -->
<meta property="og:type" content="website">
<meta property="og:title" content="OpenTRAP - a free, open-source alternative to Burp Suite">
<meta property="og:description" content="{{ site.description }}">
<meta property="og:url" content="https://opentrap.github.io/opentrap/">
<meta property="og:image" content="https://opentrap.github.io/opentrap/images/dashboard.png">
<meta name="twitter:card" content="summary_large_image">

<style>
:root{
  --navy:#14233b; --navy2:#0e1a2e; --orange:#db612f; --orange-d:#c0551f;
  --ink:#1b2a3a; --muted:#5d6b7a; --line:#e2e8f0; --bg-soft:#f6f8fb; --white:#fff;
  --maxw:1120px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);line-height:1.6;background:var(--white);-webkit-font-smoothing:antialiased}
a{color:var(--orange);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}

/* nav */
.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:18px;height:64px}
.nav .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;color:var(--navy)}
.nav .brand img{width:28px;height:28px}
.nav .links{margin-left:auto;display:flex;align-items:center;gap:22px}
.nav .links a{color:var(--navy);font-weight:600;font-size:15px}
.nav .links a:hover{color:var(--orange);text-decoration:none}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;border-radius:999px;
  padding:11px 22px;font-size:15px;cursor:pointer;border:0;transition:.15s}
.btn-primary{background:var(--orange);color:#fff}
.btn-primary:hover{background:var(--orange-d);color:#fff;text-decoration:none}
.btn-ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--orange);color:var(--orange);text-decoration:none}

/* hero */
.hero{padding:72px 0 64px}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center}
.hero h1{font-size:60px;line-height:1.02;margin:0 0 6px;color:var(--navy);font-weight:800;letter-spacing:-1px}
.hero .sub{font-size:20px;color:var(--orange);font-weight:700;margin:0 0 20px}
.hero p.lead{font-size:18px;color:var(--muted);margin:0 0 28px;max-width:30em}
.hero .cta{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.hero .shot{border-radius:12px;border:1px solid var(--line);box-shadow:0 24px 60px -24px rgba(20,35,59,.45);overflow:hidden}
.hero .shot img{display:block}

/* dark band */
.band{background:var(--navy);color:#dfe7f0;padding:72px 0}
.band h2{color:#fff;font-size:34px;margin:0 0 8px;font-weight:800}
.band .lead{color:#9fb0c4;font-size:18px;margin:0 0 36px}
.band .grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.band .shot{border-radius:10px;overflow:hidden;box-shadow:0 20px 50px -20px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.08)}
.checks{list-style:none;margin:0;padding:0}
.checks li{display:flex;gap:14px;padding:12px 0;align-items:flex-start}
.checks .ic{flex:0 0 24px;margin-top:2px}
.checks b{color:#fff;display:block;font-size:17px}
.checks span{color:#9fb0c4}

/* sections */
section.pad{padding:72px 0}
.section-head{text-align:center;max-width:40em;margin:0 auto 44px}
.section-head h2{font-size:34px;color:var(--navy);margin:0 0 10px;font-weight:800}
.section-head p{color:var(--muted);font-size:18px;margin:0}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;
  box-shadow:0 10px 30px -18px rgba(20,35,59,.3);transition:.15s}
.card:hover{box-shadow:0 18px 44px -18px rgba(20,35,59,.45);transform:translateY(-2px)}
.card img{display:block;border-bottom:1px solid var(--line)}
.card .cap{padding:16px 18px}
.card .cap b{color:var(--navy);display:block;font-size:17px;margin-bottom:3px}
.card .cap span{color:var(--muted);font-size:14.5px}

.soft{background:var(--bg-soft)}
.steps{max-width:760px;margin:0 auto}
.steps pre{background:var(--navy);color:#e6edf5;padding:14px 18px;border-radius:8px;overflow:auto;
  font-size:14.5px;margin:10px 0}
.steps code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.faq{max-width:820px;margin:0 auto}
.faq .q{border-bottom:1px solid var(--line);padding:20px 0}
.faq .q b{color:var(--navy);font-size:18px;display:block;margin-bottom:6px}
.faq .q span{color:var(--muted)}

.orgs{list-style:none;margin:0 auto;padding:0;max-width:820px;display:grid;gap:14px}
.orgs li{display:flex;gap:18px;align-items:center;padding:16px 18px;border:1px solid var(--line);
  border-radius:12px;background:#fff}
.orgs li .logo{flex:0 0 130px;display:flex;align-items:center;justify-content:center;height:46px}
.orgs li .logo img{max-height:40px;max-width:120px;width:auto;height:auto}
.orgs li b{color:var(--navy);font-size:17px}
.orgs li .d{color:var(--muted);font-size:14.5px}

footer{background:var(--navy2);color:#9fb0c4;padding:48px 0;font-size:15px}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
footer a{color:#cdd8e6}
footer .fl{display:flex;gap:22px;flex-wrap:wrap}

@media (max-width:860px){
  .hero .wrap,.band .grid,.gallery{grid-template-columns:1fr}
  .hero{padding:48px 0}
  .hero h1{font-size:44px}
  .nav .links a:not(.btn){display:none}
  .band .grid .shot{order:2}
}
</style>
</head>
<body>

<nav class="nav"><div class="wrap">
  <a class="brand" href="/opentrap/"><img src="images/opentrap.svg" alt="">OpenTRAP</a>
  <div class="links">
    <a href="#features">Features</a>
    <a href="#screenshots">Screenshots</a>
    <a href="#get-started">Get started</a>
    <a href="https://github.com/opentrap/opentrap">GitHub</a>
    <a class="btn btn-primary" href="https://github.com/opentrap/opentrap/releases/latest/download/opentrap-x86_64.appimage">Download</a>
  </div>
</div></nav>

{{ content }}

<footer><div class="wrap">
  <div>OpenTRAP - independent open-source software, released under the GNU AGPL v3.0.</div>
  <div class="fl">
    <a href="https://github.com/opentrap/opentrap">GitHub</a>
    <a href="https://github.com/opentrap/opentrap/releases/latest">Releases</a>
    <a href="https://github.com/opentrap/opentrap/blob/main/CONTRIBUTING.md">Contribute</a>
    <a href="https://www.gnu.org/licenses/agpl-3.0.html">Licence</a>
  </div>
</div></footer>

</body>
</html>
